name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: offline contract and patch checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The plugin has no runtime or dev dependencies: no install step needed.
      - name: Syntax check
        run: node --check index.js
      - name: Contract and patch checks
        run: npm test
      - name: Verify the publishable tarball
        run: npm pack --dry-run
